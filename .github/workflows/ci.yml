name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run scan
      - run: bun run package:check

  relay:
    name: Relay server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relayd
      - run: cargo fmt --manifest-path relayd/Cargo.toml --check
      - run: cargo clippy --manifest-path relayd/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path relayd/Cargo.toml
      - run: cargo run --quiet --manifest-path relayd/Cargo.toml -- self-test
      - run: cargo build --manifest-path relayd/Cargo.toml --release
      - uses: actions/upload-artifact@v4
        with:
          name: omp-relayd-linux-x86_64
          path: relayd/target/release/omp-relayd
          if-no-files-found: error
